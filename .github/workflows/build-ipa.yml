name: Compilar IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  APP_VERSION: 1.3.0

jobs:
  build:
    name: Crear IPA sin firmar
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Compilar para iPhone
        run: |
          xcodebuild \
            -project IntervalosCasa.xcodeproj \
            -scheme IntervalosCasa \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${APP_VERSION}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            clean build

      - name: Empaquetar IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Intervalos.app Payload/
          zip -r "Intervalos-v${APP_VERSION}.ipa" Payload

      - name: Publicar descarga
        uses: actions/upload-artifact@v4
        with:
          name: Intervalos-v${{ env.APP_VERSION }}-IPA
          path: Intervalos-v${{ env.APP_VERSION }}.ipa
          if-no-files-found: error
          retention-days: 30
