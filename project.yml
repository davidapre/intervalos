name: IntervalosCasa
options:
  bundleIdPrefix: com.intervalosencasa
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    PRODUCT_BUNDLE_IDENTIFIER: com.intervalosencasa.app
    DEVELOPMENT_TEAM: ""
targets:
  IntervalosCasa:
    type: application
    platform: iOS
    sources:
      - path: IntervalosCasa
    settings:
      base:
        INFOPLIST_FILE: IntervalosCasa/Info.plist
        PRODUCT_NAME: Intervalos
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    info:
      path: IntervalosCasa/Info.plist
      properties:
        CFBundleDisplayName: Intervalos
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
